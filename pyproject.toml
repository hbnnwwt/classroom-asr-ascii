[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-asr"
version = "0.1.0"
description = "课堂录课本地语音识别系统"
requires-python = ">=3.10,<3.12"

[tool.setuptools.packages.find]
where = ["."]
include = ["asr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
