<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设置 - Classroom ASR</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- 首帧前应用已存的主题选择，避免闪一下错误配色（theme.js 见 body 末尾） -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* localStorage 不可用就跟随系统 */ }
  </script>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <a href="/" class="back-link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          返回项目列表
        </a>
        <h1>设置</h1>
      </div>
      <div class="header-actions">
        <button id="theme-toggle" type="button" class="theme-toggle" aria-label="切换主题">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        </button>
      </div>
    </header>

    <section class="panel settings-panel">
      <div class="section-head">
        <h2>AI 整理与教学反馈</h2>
        <span id="llm-state" class="status-badge status-pending" hidden>未配置</span>
      </div>
      <p class="hint">
        选择服务商，填写模型名称与访问密钥。服务地址与模型名称都填好即启用；清空其中一项后保存可关闭。
        生成 AI 内容时，逐字稿会发送至此处配置的服务。本地 Ollama 可留空密钥。
      </p>
      <form id="llm-form">
        <label>
          服务商（选择后填入建议地址与模型，可自行修改）
          <select id="preset">
            <option value="">手动输入</option>
            <option value="ollama">Ollama 本地</option>
            <option value="deepseek">DeepSeek</option>
            <option value="siliconflow">硅基流动 SiliconFlow</option>
            <option value="modelscope">ModelScope</option>
            <option value="minimax">MiniMax</option>
            <option value="zhipu">智谱 GLM</option>
            <option value="openai">OpenAI</option>
          </select>
        </label>
        <label>
          模型名称
          <input type="text" id="model" placeholder="服务商提供的模型名称，如 qwen2.5:7b" />
        </label>
        <label>
          访问密钥
          <input type="password" id="api-key" placeholder="输入新密钥；留空保留已保存的密钥" autocomplete="new-password" aria-describedby="key-state" />
        </label>
        <p id="key-state" class="hint field-note" role="status"></p>
        <label class="checkbox"><input type="checkbox" id="clear-api-key" />清除已保存的密钥</label>
        <details class="settings-advanced"><summary>高级设置</summary>
        <label>
          服务地址（OpenAI 兼容接口）
          <input type="text" id="base-url" placeholder="http://localhost:11434/v1" />
        </label>
        <div class="form-row">
          <label>
            请求超时（秒）
            <input type="number" id="timeout" min="1" value="300" />
          </label>
          <label>
            单次输出上限（tokens）
            <input type="number" id="max-tokens" min="1" value="16384" />
          </label>
        </div>
        </details>
        <div class="form-actions">
          <button type="button" id="test-btn" class="btn">测试连接</button>
          <button type="button" id="save-btn" class="btn btn-primary">保存</button>
        </div>
      </form>
      <p id="test-result" role="status" aria-live="polite" hidden></p>
      <p id="save-result" role="status" aria-live="polite" hidden></p>
      <a id="return-task" class="btn" hidden></a>
    </section>
  </main>

  <script src="/static/theme.js"></script>
  <script src="/static/settings.js"></script>
</body>
</html>
