<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Classroom ASR · 项目管理</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- 首帧前应用已存的主题选择，避免闪一下错误配色（theme.js 见 body 末尾） -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* localStorage 不可用就跟随系统 */ }
  </script>
</head>
<body>
  <main>
    <header class="page-header">
      <h1>Classroom ASR</h1>
      <div class="header-actions">
        <a href="/settings" class="theme-toggle" aria-label="设置" title="设置（LLM / AI 反馈）">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </a>
        <button id="theme-toggle" type="button" class="theme-toggle" aria-label="切换主题">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        </button>
        <button id="new-project-btn" type="button" class="primary">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新建项目
        </button>
      </div>
    </header>

    <!-- 新建项目表单（默认折叠） -->
    <section id="upload-panel" hidden>
      <form id="upload-form">
        <label>
          项目名称（可选，留空用文件名）
          <input type="text" id="project-name-input" placeholder="如：第3章 神经网络" maxlength="80" />
        </label>
        <label class="dropzone" id="dropzone">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
          <span class="dz-main" id="dz-main">点击选择文件，或拖拽到此处</span>
          <span class="dz-sub" id="dz-sub">支持 mp4 / mov / mp3 / wav 等音视频；多段自动拼接音轨连续转写</span>
          <input type="file" id="file-input" name="file" accept="video/*,audio/*" required multiple />
        </label>

        <!-- 多段拼接（选中 ≥2 个文件时出现，只管顺序，别的一概不管） -->
        <div id="merge-panel" hidden>
          <div class="merge-block">
            <span class="merge-block-title">已选 <strong id="parts-count">0</strong> 段（按此顺序拼接音轨）</span>
            <ul id="parts-list" aria-label="段落列表"></ul>
          </div>
        </div>

        <div class="form-row">
          <label>
            转写用途
            <select id="quality" name="quality">
              <option value="balanced" selected>字幕转写（推荐）</option>
              <option value="fast">快速文字（无精细时间戳）</option>
            </select>
          </label>
          <label class="checkbox">
            <input type="checkbox" id="diarize" name="diarize" />
            区分不同说话人（实验性）
          </label>
          <!-- 默认整个藏起来：list.js 探测到 llm 配置才显示——没配置的用户不该看到死开关 -->
          <label class="checkbox" id="ai-feedback-block" hidden>
            <input type="checkbox" id="ai-feedback" name="ai_feedback" />
            生成教学点评与整理后的逐字稿
          </label>
        </div>
        <p class="hint field-note">说话人按声音区分，结果需核对。快速文字适合先看内容，字幕时间信息较粗。</p>
        <p class="hint field-note" id="ai-privacy" hidden>转写在本机进行；开启 AI 后，逐字稿会发送至设置中配置的服务。</p>
        <div id="upload-feedback" class="upload-feedback" hidden>
          <p id="upload-message" role="status" aria-live="polite"></p>
          <progress id="upload-progress" max="100" value="0" aria-label="文件上传进度"></progress>
          <a id="upload-task-link" class="btn" hidden>查看已接收的任务</a>
          <button id="upload-check-btn" type="button" class="btn" hidden>查询接收结果</button>
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn" class="primary">开始转写</button>
          <button type="button" id="cancel-upload-btn">取消</button>
        </div>
      </form>
    </section>

    <!-- 搜索 + 筛选 -->
    <section id="toolbar">
      <input type="search" id="search-input" placeholder="搜索项目名 / 文件名..." aria-label="搜索项目" />
      <select id="status-filter" aria-label="按状态筛选">
        <option value="">全部状态</option>
        <option value="pending">等待中</option>
        <option value="running">处理中</option>
        <option value="done">已完成</option>
        <option value="failed">失败</option>
      </select>
      <span id="total-count" class="meta" role="status" aria-live="polite"></span>
    </section>

    <!-- 批量操作工具栏（默认隐藏） -->
    <section id="batch-toolbar" hidden>
      <span class="batch-info">已选 <strong id="selected-count">0</strong> 项</span>
      <button id="batch-export-btn" type="button" class="action-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/><path d="M10 12h4"/></svg>
        导出 ZIP
      </button>
      <button id="batch-delete-btn" type="button" class="action-btn danger">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        批量删除
      </button>
      <button id="batch-clear-btn" type="button" class="action-btn">取消选择</button>
      <span id="batch-busy-note" class="field-note" hidden></span>
    </section>

    <!-- 项目列表 -->
    <section id="projects-panel">
      <table id="projects-table">
        <thead>
          <tr>
            <th class="col-check"><input type="checkbox" id="select-all" aria-label="全选" /></th>
            <th>项目名</th>
            <th>文件名</th>
            <th>状态</th>
            <th>进度</th>
            <th>段数</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="projects-body">
        </tbody>
      </table>
      <div id="empty-state" hidden>
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8"/><path d="M16 17H8"/><path d="M10 9H8"/></svg>
        <p id="empty-message">还没有转写项目<br />上传课堂录音，开始后会逐段显示识别文字。</p>
        <button type="button" class="primary" id="empty-new-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          新建第一个项目
        </button>
        <button type="button" class="btn" id="empty-clear-btn" hidden>清除搜索与筛选</button>
      </div>
    </section>
  </main>

  <script src="/static/theme.js"></script>
  <script src="/static/list.js"></script>
</body>
</html>
