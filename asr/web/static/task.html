<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>项目详情 - Classroom ASR</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- 首帧前应用已存的主题选择，避免闪一下错误配色（theme.js 见 body 末尾） -->
  <script>
    try {
      var t = localStorage.getItem("theme");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* localStorage 不可用就跟随系统 */ }
  </script>
</head>
<body>
  <main>
    <header class="page-header">
      <div>
        <a href="/" class="back-link">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          返回项目列表
        </a>
        <h1 id="project-name">项目详情</h1>
      </div>
      <div class="header-actions">
        <a href="/settings" class="theme-toggle" aria-label="设置" title="设置（LLM / AI 反馈）">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
        </a>
        <button id="theme-toggle" type="button" class="theme-toggle" aria-label="切换主题">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        </button>
      </div>
    </header>

    <div class="layout">
      <!-- 左栏：状态 + 下载 -->
      <div class="col-left">
        <section id="status-panel">
          <div class="status-row">
            状态：<strong id="status">-</strong>
            <span class="meta">· 已用 <strong id="task-elapsed">-</strong></span>
            <span class="meta">· ID: <code id="task-id"></code></span>
          </div>

          <ol class="stages" id="stages">
            <li data-stage="merge"><span class="mark">·</span><span class="label">拼接音轨</span><span class="msg"></span></li>
            <li data-stage="probe"><span class="mark">·</span><span class="label">探测音视频</span><span class="msg"></span></li>
            <li data-stage="extract"><span class="mark">·</span><span class="label">提取音轨</span><span class="msg"></span></li>
            <li data-stage="denoise"><span class="mark">·</span><span class="label">降噪</span><span class="msg"></span></li>
            <li data-stage="asr"><span class="mark">·</span><span class="label">语音识别</span><span class="msg"></span></li>
            <li data-stage="postprocess"><span class="mark">·</span><span class="label">后处理</span><span class="msg"></span></li>
            <li data-stage="write"><span class="mark">·</span><span class="label">写输出文件</span><span class="msg"></span></li>
            <!-- AI 行默认在 DOM 里，task.js 按 meta 显隐——没开过 AI 的任务看不到 -->
            <li data-stage="ai"><span class="mark">·</span><span class="label">AI 反馈</span><span class="msg"></span></li>
            <li data-stage="done"><span class="mark">·</span><span class="label">完成</span><span class="msg"></span></li>
          </ol>

          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill">0%</div>
          </div>

          <div id="error" class="error" hidden></div>

          <div id="downloads" hidden>
            <h3>下载输出</h3>
            <div class="download-list">
              <a class="btn btn-primary" data-fmt="srt">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/></svg>
                SRT 字幕
              </a>
              <a class="btn" data-fmt="txt">TXT</a>
              <a class="btn" data-fmt="vtt">VTT</a>
              <a class="btn" data-fmt="md">MD</a>
              <a class="btn" data-fmt="json">JSON</a>
              <!-- AI 产物：有 ai_files 才显示（renderAiUi 控制）；下载收进阅读层 -->
              <button class="btn btn-view" type="button" data-view="feedback" hidden title="页面内阅读 AI 点评报告">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                查看 AI 点评
              </button>
              <button class="btn btn-view" type="button" data-view="polished" hidden title="页面内阅读优化逐字稿">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                查看优化稿
              </button>
              <a class="btn" data-fmt="mp4" hidden title="拼接合并后的完整视频（仅旧版合并任务）">MP4 视频</a>
              <a class="btn" data-fmt="replace.log" title="术语替换日志（调试用）">replace.log</a>
            </div>
            <!-- 多段任务：每段一份独立 SRT（时间归零，直接配原视频） -->
            <div id="part-downloads" class="part-downloads" hidden>
              <h4>每段独立字幕（时间轴归零，配各段原视频）</h4>
              <ul id="part-downloads-list"></ul>
            </div>
          </div>

          <!-- AI 反馈动作：手动生成/重试（done 且 LLM 可用时出现） -->
          <div id="ai-actions" hidden>
            <div id="ai-error" class="error"></div>
            <button id="ai-retry" type="button" class="btn">生成 AI 反馈</button>
          </div>
        </section>
      </div>

      <!-- 右栏：实时转写 -->
      <div class="col-right">
        <section id="transcript-panel" hidden>
          <div class="transcript-toolbar">
            <h3>实时转写 <span id="transcript-count" class="count"></span></h3>
            <button id="live-toggle" type="button" aria-label="暂停或恢复自动滚动">
              <svg class="icon" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
              暂停滚动
            </button>
          </div>
          <div id="transcript" class="transcript"></div>
        </section>
      </div>
    </div>
  </main>

  <!-- AI 产物阅读层：查看按钮打开，下载与否现场决定 -->
  <div id="ai-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="ai-modal-title">
      <div class="modal-head">
        <h3 id="ai-modal-title">AI 产物</h3>
        <button id="ai-modal-x" type="button" class="modal-x" aria-label="关闭">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <!-- 优化稿专属：正文 / 修改痕迹双页签（feedback 视图隐藏） -->
      <div class="modal-tabs" id="ai-modal-tabs" hidden>
        <button type="button" class="tab active" data-tab="clean">优化稿</button>
        <button type="button" class="tab" data-tab="diff">修改痕迹</button>
      </div>
      <div id="ai-modal-body" class="report"></div>
      <div class="modal-foot">
        <a id="ai-modal-dl" class="btn btn-primary">下载 .md</a>
        <button id="ai-modal-close" type="button" class="btn">关闭</button>
      </div>
    </div>
  </div>

  <script src="/static/theme.js"></script>
  <script src="/static/task.js"></script>
</body>
</html>
