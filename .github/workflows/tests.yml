name: Lightweight tests

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: Python ${{ matrix.python }} / Windows
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      # Keep this subset aligned with docs/validation.md. Importing the app and
      # fake engines does not require FunASR, ModelScope, PyTorch or model files.
      - name: Install lightweight test dependencies
        run: >-
          python -m pip install
          "pytest>=8.3" "packaging>=24" "setuptools>=68" wheel
          "pyyaml>=6" "pydantic>=2,<3" "loguru>=0.7" "click>=8.1"
          "fastapi>=0.110" "uvicorn>=0.27" "python-multipart>=0.0.9"
          "httpx>=0.27" "requests>=2.28" "diff-match-patch>=20241021"
          "tqdm>=4.66" "numpy>=1.24,<3" "soundfile>=0.12"
      - name: Run unit and synthetic integration tests
        run: python -m pytest -q
